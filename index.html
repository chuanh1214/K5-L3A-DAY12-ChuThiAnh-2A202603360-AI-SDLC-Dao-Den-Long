<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đảo Đèn Lồng</title>
  <link rel="stylesheet" href="/src/style.css">
  <script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head>
<body>
  <main id="game" aria-label="Đảo Đèn Lồng"></main>
  <section class="hud" aria-label="Thông tin trận">
    <div class="hud-group health"><span>Ngọn Lửa</span><strong id="flames"></strong></div>
    <div class="hud-group clock"><span id="night-label"></span><strong id="timer">05:00</strong></div>
    <div class="hud-group score"><span id="lanterns"></span><strong id="score">0</strong></div>
  </section>
  <div id="wind-warning" class="wind-warning" aria-live="polite"></div>
  <div id="subtitles" class="subtitles" aria-live="polite"></div>
  <div id="target-arrow" class="target-arrow" aria-hidden="true">➤</div>
  <div id="shade-arrow" class="target-arrow shade-arrow" aria-hidden="true" hidden>➤</div>
  <div class="bottom">
    <div id="prompt" aria-live="polite"></div>
    <div class="hud-bottom">
      <div class="mote-meter"><span id="mote-count">Đom đóm</span><div id="mote-slots" aria-hidden="true"></div></div>
      <div id="abilities" class="abilities"></div>
    </div>
    <div id="controls" class="controls"></div>
    <div id="fps" class="fps">FPS --</div>
  </div>
  <section id="overlay" class="overlay">
    <div class="panel">
      <div id="eyebrow" class="eyebrow">Đêm 1 · Đảo Bến</div>
      <h1 id="headline">Đảo Đèn Lồng</h1>
      <p id="message">Mây cần thắp lại những ngọn đèn trước khi bình minh lên.</p>
      <div id="settings-panel" class="settings-panel" hidden>
        <label>Âm lượng <output id="volume-value"></output><input id="volume" type="range" min="0" max="1" step="0.05"></label>
        <label>Độ nhạy chuột <input id="sensitivity" type="range" min="0.25" max="2" step="0.05"></label>
        <label>Bảng màu dễ phân biệt <input id="accessible-palette" type="checkbox"></label>
        <label>Giảm chuyển động <input id="reduced-motion" type="checkbox"></label>
        <label>Chữ lớn <input id="large-text" type="checkbox"></label>
        <fieldset><legend>Đổi phím</legend><div id="bindings"></div>
          <button id="reset-bindings" class="secondary" type="button">Khôi phục mặc định</button>
          <p id="binding-status" role="status"></p>
        </fieldset>
      </div>
      <form id="save-score" hidden>
        <label>Tên <input name="name" required minlength="3" maxlength="12" pattern="[A-Za-z0-9_]{3,12}" title="3–12 ký tự gồm chữ không dấu, số hoặc dấu gạch dưới" autocomplete="off"></label>
        <button type="submit">Lưu điểm</button>
        <p id="save-status" role="status"></p>
      </form>
      <ol id="leaderboard" hidden></ol>
      <div id="menu-buttons" class="menu-buttons"></div>
    </div>
  </section>
  <script type="module" src="/src/browser-v11.mjs"></script>
</body>
</html>
